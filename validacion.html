<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capoñuelo</title>
</head>
<body>
    <main>
        <header>
            <!--logotipo-->
            <img src="imagenes/logotipo.png" alt="logotipo de capoñuelo">
            <!--encabezado-->
            <h1>¡Bienvenido!</h1>
            <p>Inicia sesión para continuar</p>
        </header>
        <!--formulario de validación-->
        <form>
            <div><!--ingresar usuario-->
                <label for="usuario">usuario o correo electrónico</label>
                <input type="text" id="usuario" placeholder="usuario o correo electrónico" name="usuario" required>  
            </div>
            <div>
                <label for="contrasena">contraseña</label>
                <input type="password" id="contrasena" placeholder="contraseña" name="contrasena" required>
            </div>
            <div>
                <label for="recordarme">Recordarme</label>        
                <input type="checkbox" id="recordarme" name="recordarme">
            </div>
            <a href="#">¿Olvidaste tu contraseña?</a>
            <button type="submit">Iniciar Sesión</button>
            <a href="registro.html" class="registrarse">Registrarse</a><!--diseño de botón-->
        </form>
    </main>
</body>
</html>
