<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/error.css">
    <title>error</title>
</head>
<body>
    <main>
        <header>
            <img src="imagenes/error.png" alt="logotipo de error">
            <h1>Oops... Algo salió mal</h1>
            <p>No pudimos procesar tu solicitud. por favor, revisa la siguiente información e intenta nuevamente</p>
        </header>
            <div>
                <!-- La imagen está fuera de la lista para mantener la validez semántica HTML -->
                <img src="imagenes/error.png" alt="logotipo de error">
                <ul>
                    <li>El usuario o la contraseña son incorrectos</li>
                    <li>Verifica que todos los campos estén bien diligenciados</li>
                    <li>Si el problema persiste, contacte al administrador del sistema</li>
                </ul>
            </div>
            <div>
                <!--botón estático  no dirige a ningun lugar-->
                <button type="button">Volver a intentar</button>
            </div>
    </main>
</body>
</html>
