<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/registro.css">
    <title>registro</title>
</head>
<body>
    <main>
        <header>
            <!--enlace hacia validacion.html-->
            <a href="validacion.html">Volver</a>
            <!--logotipo-->
            <img src="imagenes/logotipo.png" alt="logotipo de capoñuelo">
            <!--encabezado-->
            <h1>Registro de usuario</h1>
            <p>Completa la información para crear una cuenta</p>
        </header>    
        <!--formulario de registro-->
        <form>
            <label for="nombres">Ingrese sus nombres</label>
            <input type="text" id="nombres" placeholder="Ingrese sus nombres" name="nombres" required>

            <label for="apellidos">Ingrese sus apellidos</label>
            <input type="text" id="apellidos" placeholder="Ingrese sus apellidos" name="apellidos" required>

            <label for="email">Ingrese su email</label>
            <input type="email" id="email" placeholder="Ingrese su email" name="email" required>

            <label for="contraseña">Ingrese una contraseña</label>
            <input type="password" id="contraseña" placeholder="Ingrese una contraseña" name="contraseña" required>

            <button type="submit">Registrarse</button>
            <a href="validacion.html">Cancelar</a><!--diseño de botón-->
        </form>
    </main>
</body>
</html>
